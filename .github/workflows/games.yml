name: Football Daily construction

on:
  schedule:
    # 01h30 UTC = 01h30 à Abidjan
    - cron: "30 1 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  football:
    runs-on: ubuntu-latest

    steps:

      # ─────────────────────────────────────────────
      # 1. Récupération du dépôt
      # ─────────────────────────────────────────────
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      # ─────────────────────────────────────────────
      # 2. Synchronisation AVANT toute modification
      # ─────────────────────────────────────────────
      - name: Pull avec rebase
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin main
          git pull --rebase origin main

      # ─────────────────────────────────────────────
      # 3. Installation de Python
      # ─────────────────────────────────────────────
      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # ─────────────────────────────────────────────
      # 4. Installation des dépendances
      # ─────────────────────────────────────────────
      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install requests urllib3

      # ─────────────────────────────────────────────
      # 5. Vérifier Football.py
      # ─────────────────────────────────────────────
      - name: Vérifier Football.py
        run: |
          test -f Football.py
          echo "Football.py trouvé."

      # ─────────────────────────────────────────────
      # 6. Exécuter le script
      # ─────────────────────────────────────────────
      - name: Exécuter Football.py
        run: |
          python Football.py

      # ─────────────────────────────────────────────
      # 7. Vérifier le JSON généré
      # ─────────────────────────────────────────────
      - name: Vérifier games_of_day.json
        run: |
          test -f games_of_day.json
          ls -lh games_of_day.json
          python -m json.tool games_of_day.json > /dev/null
          echo "JSON valide."

      # ─────────────────────────────────────────────
      # 8. Vérifier les modifications
      # ─────────────────────────────────────────────
      - name: Vérifier Git
        run: |
          git status --short
          git diff --stat

      # ─────────────────────────────────────────────
      # 9. Commit et push
      # ─────────────────────────────────────────────
      - name: Commit et push
        run: |
          git add games_of_day.json

          if git diff --cached --quiet; then
            echo "Aucune modification à enregistrer."
            exit 0
          fi

          git commit -m "Update football data"

          git push origin main