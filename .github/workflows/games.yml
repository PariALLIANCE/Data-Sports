name: Football - Analyse quotidienne

on:
  schedule:
    # 01h30 UTC = 01h30 en Côte d'Ivoire
    - cron: "30 1 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  football:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Git pull --rebase avant modification
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin
          git pull --rebase origin "${GITHUB_REF_NAME}"

      - name: Installer requests
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Exécuter Football.py
        run: |
          python final.py

      - name: Vérifier les fichiers générés
        run: |
          echo "Contenu de data/football :"
          ls -lah data/football/ || true

      - name: Commit et push
        run: |
          git add -A data/football/

          if git diff --cached --quiet; then
            echo "Aucune modification à sauvegarder."
            exit 0
          fi

          git commit -m "chore: mise à jour des données football"

          git pull --rebase origin "${GITHUB_REF_NAME}"

          git push origin "HEAD:${GITHUB_REF_NAME}"