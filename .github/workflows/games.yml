name: Football - Analyse quotidienne

on:
  schedule:
    - cron: "30 1 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  football:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Git pull --rebase avant modification
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin
          git pull --rebase origin "${GITHUB_REF_NAME}"

      - name: Sauvegarder l'ancien games_of_day.json
        run: |
          if [ -f data/football/games_of_day.json ]; then
            cp data/football/games_of_day.json /tmp/games_of_day_old.json
            echo "ancien_fichier=true" >> "$GITHUB_ENV"
            echo "Ancien games_of_day.json sauvegardé."
          else
            echo "ancien_fichier=false" >> "$GITHUB_ENV"
            echo "Aucun ancien games_of_day.json."
          fi

      - name: Installer requests
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Exécuter Football.py
        run: |
          python Football.py

      - name: Vérifier si le contenu a changé
        run: |
          if [ ! -f data/football/games_of_day.json ]; then
            echo "❌ games_of_day.json n'a pas été généré."
            exit 1
          fi

          if [ "$ancien_fichier" = "true" ]; then
            if cmp -s /tmp/games_of_day_old.json data/football/games_of_day.json; then
              echo "CONTENU_IDENTIQUE=true" >> "$GITHUB_ENV"
              echo "ℹ️ Le nouveau games_of_day.json est identique à l'ancien."
            else
              echo "CONTENU_IDENTIQUE=false" >> "$GITHUB_ENV"
              echo "🆕 Le contenu de games_of_day.json a changé."
            fi
          else
            echo "CONTENU_IDENTIQUE=false" >> "$GITHUB_ENV"
            echo "🆕 Première génération de games_of_day.json."
          fi

      - name: Archiver l'ancien fichier si le contenu a changé
        if: env.CONTENU_IDENTIQUE == 'false' && env.ancien_fichier == 'true'
        run: |
          mkdir -p data/football

          if [ -f data/football/historique.json ]; then
            python - <<'PY'
import json

history_file = "data/football/historique.json"

try:
    with open(history_file, "r", encoding="utf-8") as f:
        history = json.load(f)

    if not isinstance(history, list):
        history = [history]

except (FileNotFoundError, json.JSONDecodeError):
    history = []

with open("/tmp/games_of_day_old.json", "r", encoding="utf-8") as f:
    old_data = json.load(f)

history.append(old_data)

with open(history_file, "w", encoding="utf-8") as f:
    json.dump(history, f, indent=2, ensure_ascii=False)

print("📦 Ancien games_of_day.json ajouté à historique.json")

PY
  else
            python - <<'PY'
import json

with open("/tmp/games_of_day_old.json", "r", encoding="utf-8") as f:
    old_data = json.load(f)

with open("data/football/historique.json", "w", encoding="utf-8") as f:
    json.dump([old_data], f, indent=2, ensure_ascii=False)

print("📦 historique.json créé avec l'ancien games_of_day.json")

PY
          fi

      - name: Vérifier les fichiers
        run: |
          echo "📁 Contenu de data/football :"
          ls -lah data/football/

      - name: Commit et push
        run: |
          git add -A data/football/

          if git diff --cached --quiet; then
            echo "ℹ️ Aucun changement à sauvegarder."
            exit 0
          fi

          git commit -m "chore: mise à jour des données football"

          git pull --rebase origin "${GITHUB_REF_NAME}"

          git push origin "HEAD:${GITHUB_REF_NAME}"